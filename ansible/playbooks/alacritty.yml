---
- hosts: all
  become: yes
  tasks:
    - name: Installing fzf dependencies
      apt:
        name: "{{ item }}"
        update_cache: yes
      loop:
        - git
        - cmake
        - pkg-config
        - libfreetype6-dev
        - libfontconfig1-dev
        - libxcb-xfixes0-dev
        - libxkbcommon-dev
        - python3

    - name: Cloning alacritty
      git:
        repo: https://github.com/alacritty/alacritty.git
        dest: /tmp
        clone: yes
        update: yes
        version: v0.13.2
      become: yes
      become_user: "{{ lookup('env', 'USER') }}"
    

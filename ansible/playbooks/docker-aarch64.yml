- name: Install Docker engine
  hosts: "*"
  become: true
  tasks:
  - name: install dependencies
    apt:
      name: 
       - ca-certificates 
       - curl 
      state: present
      update_cache: true
    become: true

  - name: add GPG key
    apt_key:
      url: https://download.docker.com/linux/ubuntu/gpg
      state: present

  - name: add docker repository to apt
    apt_repository:
      filename: docker 
      repo: deb [arch=arm64] https://download.docker.com/linux/ubuntu noble stable
      state: present

  - name: install docker engine
    apt:
      name: 
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
      state: present
      update_cache: true
    become: true

  - name: test docker
    command: docker info
    become: true
